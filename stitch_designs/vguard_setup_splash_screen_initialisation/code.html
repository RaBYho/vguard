  <script>
    lucide.createIcons();

    // Subtle realistic progress simulation
    const progressBar = document.getElementById('progress-bar');
    const percentLabel = document.getElementById('percent-label');
    const stepName = document.getElementById('step-name');
    const statusTitle = document.getElementById('status-title');
    const simBtn = document.getElementById('sim-btn');

    let currentVal = 68;
    let timer = null;

    function runAnimation() {
      currentVal = 10;
      updateUI(10, 'Initialisation du générateur CSPRNG');
      
      clearInterval(timer);
      timer = setInterval(() => {
        if (currentVal < 98) {
          const inc = Math.floor(Math.random() * 4) + 2;
          currentVal = Math.min(98, currentVal + inc);
          
          let step = 'Calcul d’entropie';
          if (currentVal > 25 && currentVal <= 55) step = 'Dérivation Argon2id (m=64MB, t=4)';
          if (currentVal > 55 && currentVal <= 85) step = 'Chiffrement du conteneur AES-256-GCM';
          if (currentVal > 85) step = 'Finalisation de la clé locale du coffre';

          updateUI(currentVal, step);
        } else if (currentVal === 98) {
          setTimeout(() => {
            currentVal = 100;
            updateUI(100, 'Coffre VGuard initialisé avec succès !');
            if (statusTitle) {
              statusTitle.innerHTML = '<span class="text-[#10B981] flex items-center gap-2"><i data-lucide="check-circle" class="w-6 h-6"></i> Coffre prêt !</span>';
              lucide.createIcons();
            }
          }, 600);
          clearInterval(timer);
        }
      }, 140);
    }

    function updateUI(val, stepText) {
      if (progressBar) progressBar.style.width = val + '%';
      if (percentLabel) percentLabel.textContent = val + '%';
      if (stepName) stepName.textContent = stepText;
    }

    simBtn?.addEventListener('click', (e) => {
      e.preventDefault();
      runAnimation();
    });
  </script>
